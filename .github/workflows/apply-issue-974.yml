name: Apply and validate issue 974

on:
  push:
    branches:
      - feat/issue-974-client-response-cache
    paths:
      - .github/workflows/apply-issue-974.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-974-client-response-cache
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Download validated implementation patch
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/starsaintf/codex-skills-pack/ci/rust-sdk-issue-974-validation/ci/rust-sdk-issue-974-cache-draft.patch \
            --output /tmp/issue-974.patch

      - name: Apply implementation
        run: |
          git apply --check /tmp/issue-974.patch
          git apply /tmp/issue-974.patch

      - name: Format and verify source
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Compile all rmcp features
        run: cargo check -p rmcp --all-features

      - name: Run focused cache tests
        run: cargo test -p rmcp --all-features service::client::tests -- --nocapture

      - name: Run cache-hint integration tests
        run: cargo test -p rmcp --all-features --test test_cache_hints -- --nocapture

      - name: Run complete rmcp test suite
        run: cargo test -p rmcp --all-features

      - name: Run Clippy
        run: cargo clippy -p rmcp --all-targets --all-features -- -D warnings

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/rmcp/src/service.rs \
            crates/rmcp/src/service/client.rs \
            crates/rmcp/src/handler/client.rs
          git commit -m "feat(client): honor TTL cache hints"
          git push origin HEAD:feat/issue-974-client-response-cache
