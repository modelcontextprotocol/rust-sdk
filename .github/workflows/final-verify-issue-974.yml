name: Final verification for issue 974

on:
  push:
    branches:
      - feat/issue-974-client-response-cache
    paths:
      - .github/workflows/final-verify-issue-974.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-974-client-response-cache
          fetch-depth: 0

      - name: Fetch current upstream main
        run: |
          git remote add upstream https://github.com/modelcontextprotocol/rust-sdk.git
          git fetch upstream main
          test "$(git rev-parse origin/main)" = "$(git rev-parse upstream/main)"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: |
          uv python install
          uv venv

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Install cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install commitlint
        run: |
          npm install --global @commitlint/cli @commitlint/config-conventional
          echo "module.exports = {extends: ['@commitlint/config-conventional']}" > /tmp/commitlint.config.js

      - name: Apply final cache refinements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n--- old ---\n{old}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "crates/rmcp/src/service/client.rs",
              '''fn list_response_cache_key(prefix: &str, params: &Option<PaginatedRequestParams>) -> String {
              let cursor = params.as_ref().and_then(|params| params.cursor.as_deref());
              let cursor = serde_json::to_string(&cursor)
                  .expect("serializing an optional pagination cursor cannot fail");
              format!("{prefix}{cursor}")
          }

          fn resource_read_cache_key(params: &ReadResourceRequestParams) -> Option<String> {
              if params.input_responses.is_some() || params.request_state.is_some() {
                  return None;
              }
              Some(resource_read_cache_key_for_uri(&params.uri))
          }

          fn resource_read_cache_key_for_uri(uri: &str) -> String {
              let uri = serde_json::to_string(uri).expect("serializing a resource URI cannot fail");
              format!("{RESOURCE_READ_CACHE_PREFIX}{uri}")
          }''',
              '''fn list_response_cache_key(prefix: &str, params: &Option<PaginatedRequestParams>) -> String {
              let params = serde_json::to_string(params)
                  .expect("serializing pagination request parameters cannot fail");
              format!("{prefix}{params}")
          }

          fn resource_read_cache_key(params: &ReadResourceRequestParams) -> Option<String> {
              if params.input_responses.is_some() || params.request_state.is_some() {
                  return None;
              }
              let params = serde_json::to_string(params)
                  .expect("serializing resource request parameters cannot fail");
              Some(format!(
                  "{}{params}",
                  resource_read_cache_prefix_for_uri(&params_uri(params.as_str()))
              ))
          }

          fn params_uri(_serialized_params: &str) -> &str {
              unreachable!("resource cache keys use the request URI before serialization")
          }

          fn resource_read_cache_prefix_for_uri(uri: &str) -> String {
              let uri = serde_json::to_string(uri).expect("serializing a resource URI cannot fail");
              format!("{RESOURCE_READ_CACHE_PREFIX}{uri}:")
          }''',
          )

          # Correct the temporary helper above into the straightforward URI-prefix form while
          # still serializing the complete non-MRTR request parameters.
          replace_once(
              "crates/rmcp/src/service/client.rs",
              '''              let params = serde_json::to_string(params)
                  .expect("serializing resource request parameters cannot fail");
              Some(format!(
                  "{}{params}",
                  resource_read_cache_prefix_for_uri(&params_uri(params.as_str()))
              ))
          }

          fn params_uri(_serialized_params: &str) -> &str {
              unreachable!("resource cache keys use the request URI before serialization")
          }''',
              '''              let serialized = serde_json::to_string(params)
                  .expect("serializing resource request parameters cannot fail");
              Some(format!(
                  "{}{serialized}",
                  resource_read_cache_prefix_for_uri(&params.uri)
              ))
          }''',
          )

          replace_once(
              "crates/rmcp/src/service/client.rs",
              '''    pub(crate) async fn invalidate_resource_read_cache(&self, uri: &str) {
                  self.invalidate_cached_response(&resource_read_cache_key_for_uri(uri))
                      .await;
              }''',
              '''    pub(crate) async fn invalidate_resource_read_cache(&self, uri: &str) {
                  self.invalidate_cached_responses(&resource_read_cache_prefix_for_uri(uri))
                      .await;
              }''',
          )

          replace_once(
              "crates/rmcp/src/service/client/cache.rs",
              '''        let config_changed = cache.config != config;
              let partition_changed = cache.config.private_partition != config.private_partition;
              cache.config = config;
              if config_changed {
                  cache.generation = cache.generation.wrapping_add(1);
              }
              if !cache.config.enabled {
                  cache.entries.clear();
              } else if partition_changed {
                  cache
                      .entries
                      .retain(|_, entry| entry.scope == CacheScope::Public);
              }
              cache.trim_to_limit();''',
              '''        let config_changed = cache.config != config;
              let partition_changed = cache.config.private_partition != config.private_partition;
              let ttl_policy_changed = cache.config.default_ttl != config.default_ttl
                  || cache.config.max_ttl != config.max_ttl;
              cache.config = config;
              if config_changed {
                  cache.generation = cache.generation.wrapping_add(1);
              }
              if !cache.config.enabled || ttl_policy_changed {
                  cache.entries.clear();
              } else if partition_changed {
                  cache
                      .entries
                      .retain(|_, entry| entry.scope == CacheScope::Public);
              }
              cache.trim_to_limit();''',
          )

          replace_once(
              "crates/rmcp/src/service/client.rs",
              '''    #[test]
              fn paginated_pages_have_independent_cache_keys() {
                  let first = Some(PaginatedRequestParams::default().with_cursor(Some("page-a".into())));
                  let second = Some(PaginatedRequestParams::default().with_cursor(Some("page-b".into())));

                  assert_ne!(
                      list_response_cache_key(TOOL_LIST_CACHE_PREFIX, &first),
                      list_response_cache_key(TOOL_LIST_CACHE_PREFIX, &second)
                  );
              }''',
              '''    #[test]
              fn paginated_pages_have_independent_cache_keys() {
                  let first = Some(PaginatedRequestParams::default().with_cursor(Some("page-a".into())));
                  let second = Some(PaginatedRequestParams::default().with_cursor(Some("page-b".into())));

                  assert_ne!(
                      list_response_cache_key(TOOL_LIST_CACHE_PREFIX, &first),
                      list_response_cache_key(TOOL_LIST_CACHE_PREFIX, &second)
                  );
              }

              #[test]
              fn result_affecting_metadata_is_part_of_cache_keys() {
                  let mut first_meta = crate::model::Meta::new();
                  first_meta.insert("variant".into(), serde_json::json!("a"));
                  let mut second_meta = crate::model::Meta::new();
                  second_meta.insert("variant".into(), serde_json::json!("b"));

                  let first_page = Some(PaginatedRequestParams {
                      meta: Some(first_meta.clone()),
                      cursor: Some("page".into()),
                  });
                  let second_page = Some(PaginatedRequestParams {
                      meta: Some(second_meta.clone()),
                      cursor: Some("page".into()),
                  });
                  assert_ne!(
                      list_response_cache_key(TOOL_LIST_CACHE_PREFIX, &first_page),
                      list_response_cache_key(TOOL_LIST_CACHE_PREFIX, &second_page)
                  );

                  let first_resource =
                      ReadResourceRequestParams::new("file:///example").with_meta(first_meta);
                  let second_resource =
                      ReadResourceRequestParams::new("file:///example").with_meta(second_meta);
                  assert_ne!(
                      resource_read_cache_key(&first_resource),
                      resource_read_cache_key(&second_resource)
                  );
              }''',
          )

          replace_once(
              "crates/rmcp/src/service/client.rs",
              '''    #[tokio::test]
              async fn resource_update_invalidates_only_the_matching_uri() {
                  let peer = disconnected_peer();
                  let first_key = resource_read_cache_key_for_uri("file:///first");
                  let second_key = resource_read_cache_key_for_uri("file:///second");
                  for key in [&first_key, &second_key] {
                      peer.cache_response(
                          key.clone(),
                          ServerResult::ReadResourceResult(
                              ReadResourceResult::new(Vec::new())
                                  .with_ttl_ms(5_000)
                                  .with_cache_scope(CacheScope::Private),
                          ),
                          Some(5_000),
                          Some(CacheScope::Private),
                      )
                      .await;
                  }

                  peer.invalidate_resource_read_cache("file:///first").await;

                  assert!(peer.cached_response(&first_key).await.is_none());
                  assert!(peer.cached_response(&second_key).await.is_some());
              }''',
              '''    #[tokio::test]
              async fn resource_update_invalidates_every_metadata_variant_for_the_matching_uri() {
                  let peer = disconnected_peer();
                  let first_plain = ReadResourceRequestParams::new("file:///first");
                  let mut meta = crate::model::Meta::new();
                  meta.insert("variant".into(), serde_json::json!("a"));
                  let first_with_meta =
                      ReadResourceRequestParams::new("file:///first").with_meta(meta);
                  let second = ReadResourceRequestParams::new("file:///second");
                  let first_plain_key = resource_read_cache_key(&first_plain).unwrap();
                  let first_meta_key = resource_read_cache_key(&first_with_meta).unwrap();
                  let second_key = resource_read_cache_key(&second).unwrap();
                  for key in [&first_plain_key, &first_meta_key, &second_key] {
                      peer.cache_response(
                          key.clone(),
                          ServerResult::ReadResourceResult(
                              ReadResourceResult::new(Vec::new())
                                  .with_ttl_ms(5_000)
                                  .with_cache_scope(CacheScope::Private),
                          ),
                          Some(5_000),
                          Some(CacheScope::Private),
                      )
                      .await;
                  }

                  peer.invalidate_resource_read_cache("file:///first").await;

                  assert!(peer.cached_response(&first_plain_key).await.is_none());
                  assert!(peer.cached_response(&first_meta_key).await.is_none());
                  assert!(peer.cached_response(&second_key).await.is_some());
              }''',
          )

          replace_once(
              "crates/rmcp/src/service/client.rs",
              '''        let first = resource_read_cache_key_for_uri("file:///first");
                  let second = resource_read_cache_key_for_uri("file:///second");''',
              '''        let first = resource_read_cache_key(&ReadResourceRequestParams::new("file:///first"))
                      .unwrap();
                  let second = resource_read_cache_key(&ReadResourceRequestParams::new("file:///second"))
                      .unwrap();''',
          )

          replace_once(
              "crates/rmcp/src/service/client.rs",
              '''    #[tokio::test]
              async fn private_entries_are_isolated_between_client_peers() {''',
              '''    #[tokio::test]
              async fn changing_ttl_policy_invalidates_existing_entries() {
                  let peer = disconnected_peer();
                  let key = list_response_cache_key(TOOL_LIST_CACHE_PREFIX, &None);
                  peer.cache_response(
                      key.clone(),
                      ServerResult::ListToolsResult(tools_result(Some(60_000), Some(CacheScope::Public))),
                      Some(60_000),
                      Some(CacheScope::Public),
                  )
                  .await;
                  assert!(peer.cached_response(&key).await.is_some());

                  peer.set_response_cache_config(
                      ClientCacheConfig::default().with_max_ttl(Duration::from_millis(1)),
                  )
                  .await;

                  assert!(peer.cached_response(&key).await.is_none());
              }

              #[tokio::test]
              async fn private_entries_are_isolated_between_client_peers() {''',
          )

          replace_once(
              "crates/rmcp/tests/test_tool_disable_notification.rs",
              'model::{CallToolResponse, CallToolResult, ServerCapabilities, ServerInfo, Tool},',
              'model::{CacheScope, CallToolResponse, CallToolResult, ServerCapabilities, ServerInfo, Tool},',
          )
          replace_once(
              "crates/rmcp/tests/test_tool_disable_notification.rs",
              '''    trigger_disable: Arc<Notify>,
                  trigger_enable: Arc<Notify>,''',
              '''    trigger_disable: Arc<Notify>,
                  trigger_enable: Arc<Notify>,
                  list_count: Arc<AtomicUsize>,''',
          )
          replace_once(
              "crates/rmcp/tests/test_tool_disable_notification.rs",
              '''            trigger_disable: Arc::new(Notify::new()),
                      trigger_enable: Arc::new(Notify::new()),''',
              '''            trigger_disable: Arc::new(Notify::new()),
                      trigger_enable: Arc::new(Notify::new()),
                      list_count: Arc::new(AtomicUsize::new(0)),''',
          )
          replace_once(
              "crates/rmcp/tests/test_tool_disable_notification.rs",
              '''        let router = self.router.read().await;
                  Ok(rmcp::model::ListToolsResult {
                      tools: router.list_all(),
                      ..Default::default()
                  })''',
              '''        self.list_count.fetch_add(1, Ordering::SeqCst);
                  let router = self.router.read().await;
                  Ok(rmcp::model::ListToolsResult {
                      tools: router.list_all(),
                      ..Default::default()
                  }
                  .with_ttl_ms(60_000)
                  .with_cache_scope(CacheScope::Public))''',
          )
          replace_once(
              "crates/rmcp/tests/test_tool_disable_notification.rs",
              '''    let trigger_disable = server.trigger_disable.clone();
                  let trigger_enable = server.trigger_enable.clone();''',
              '''    let trigger_disable = server.trigger_disable.clone();
                  let trigger_enable = server.trigger_enable.clone();
                  let list_count = server.list_count.clone();''',
          )
          replace_once(
              "crates/rmcp/tests/test_tool_disable_notification.rs",
              '''    let tools = client_service.peer().list_tools(None).await.unwrap();
                  assert_eq!(tools.tools.len(), 2);

                  trigger_disable.notify_one();''',
              '''    let tools = client_service.peer().list_tools(None).await.unwrap();
                  assert_eq!(tools.tools.len(), 2);
                  assert_eq!(list_count.load(Ordering::SeqCst), 1);

                  let cached_tools = client_service.peer().list_tools(None).await.unwrap();
                  assert_eq!(cached_tools.tools.len(), 2);
                  assert_eq!(list_count.load(Ordering::SeqCst), 1);

                  trigger_disable.notify_one();''',
          )
          replace_once(
              "crates/rmcp/tests/test_tool_disable_notification.rs",
              '''    assert_eq!(tools.tools.len(), 1);
                  assert_eq!(tools.tools[0].name, "tool_b");''',
              '''    assert_eq!(tools.tools.len(), 1);
                  assert_eq!(tools.tools[0].name, "tool_b");
                  assert_eq!(list_count.load(Ordering::SeqCst), 2);''',
          )
          replace_once(
              "crates/rmcp/tests/test_tool_disable_notification.rs",
              '''    let tools = client_service.peer().list_tools(None).await.unwrap();
                  assert_eq!(tools.tools.len(), 2);

                  client_service.cancel().await.unwrap();''',
              '''    let tools = client_service.peer().list_tools(None).await.unwrap();
                  assert_eq!(tools.tools.len(), 2);
                  assert_eq!(list_count.load(Ordering::SeqCst), 3);

                  client_service.cancel().await.unwrap();''',
          )

          replace_once(
              "docs/CLIENT_CACHING.md",
              '''Cache keys include the method and result-affecting parameters: the cursor for
          paginated list methods and the URI for resource reads. MRTR retries containing
          `inputResponses` or `requestState` are never cached.''',
              '''Cache keys include the method and all currently result-affecting parameters: the
          cursor and `_meta` for paginated list methods, and the URI plus `_meta` for resource
          reads. MRTR retries containing `inputResponses` or `requestState` are never cached.
          A response that omits `cacheScope` is treated as private rather than made shareable.''',
          )
          PY

      - name: Run repository and acceptance checks
        id: validation
        shell: bash
        run: |
          set +e
          : > /tmp/issue-974-validation.txt
          failed=0

          run_check() {
            name="$1"
            shift
            echo "==> $name"
            "$@"
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "$name=success" | tee -a /tmp/issue-974-validation.txt
            else
              echo "$name=failed($status)" | tee -a /tmp/issue-974-validation.txt
              failed=1
            fi
          }

          run_check nightly_format cargo +nightly fmt --all
          run_check nightly_format_check cargo +nightly fmt --all -- --check
          run_check whitespace git diff --check
          run_check workspace_check cargo check --workspace --all-targets --all-features
          run_check clippy cargo clippy --all-targets --all-features -- -D warnings
          run_check default_member_tests cargo test --all-features

          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "rmcp") | .features | keys[] \
                      | select(startswith("__") | not) \
                      | select(. != "local")] | join(",")')
          run_check no_local_tests cargo test -p rmcp --features "$FEATURES"
          run_check focused_cache_tests cargo test -p rmcp --all-features service::client::tests -- --nocapture
          run_check cache_integration_test cargo test -p rmcp --all-features --test test_tool_disable_notification -- --nocapture
          run_check cache_hint_tests cargo test -p rmcp --all-features --test test_cache_hints -- --nocapture
          run_check doctests cargo test -p rmcp --doc --all-features
          run_check rustdoc env RUSTDOCFLAGS=-Dwarnings cargo doc -p rmcp --all-features --no-deps
          run_check conformance_tests cargo test --manifest-path conformance/Cargo.toml --all-features

          for dir in examples/*/; do
            if [ -f "$dir/Cargo.toml" ]; then
              if [[ "$dir" == *"wasi"* ]]; then
                rustup target add wasm32-wasip2
                run_check "example_build_${dir//\//_}" cargo build --manifest-path "$dir/Cargo.toml" --target wasm32-wasip2
              else
                run_check "example_build_${dir//\//_}" cargo build --manifest-path "$dir/Cargo.toml" --all-features --tests
                run_check "example_test_${dir//\//_}" cargo test --manifest-path "$dir/Cargo.toml" --all-features --all-targets
              fi
            fi
          done

          run_check semver_default cargo semver-checks \
            --package rmcp --baseline-rev upstream/main --release-type minor \
            --only-explicit-features --features default
          run_check semver_non_local cargo semver-checks \
            --package rmcp --baseline-rev upstream/main --release-type minor \
            --only-explicit-features --features "$FEATURES"
          run_check public_api_default cargo public-api \
            --package rmcp -ss diff --deny changed --deny removed --force upstream/main..HEAD
          run_check public_api_non_local cargo public-api \
            --package rmcp --features "$FEATURES" -ss diff \
            --deny changed --deny removed --force upstream/main..HEAD
          run_check coverage cargo llvm-cov -p rmcp --all-features --no-report

          if [ "$failed" -ne 0 ]; then
            cp /tmp/issue-974-validation.txt .issue-974-validation-result.txt
            git config user.name "starsaintf"
            git config user.email "52841317+starsaintf@users.noreply.github.com"
            git add -A
            git commit -m "ci: record issue 974 validation failure" || true
            git push origin HEAD:feat/issue-974-client-response-cache || true
            exit 1
          fi

      - name: Check spelling
        uses: crate-ci/typos@master

      - name: Squash to one reviewable commit
        run: |
          rm .github/workflows/final-verify-issue-974.yml
          rm -f .issue-974-validation-result.txt
          git reset --soft upstream/main
          git add -A
          git config user.name "starsaintf"
          git config user.email "52841317+starsaintf@users.noreply.github.com"
          git commit \
            -m "feat(client): honor SEP-2549 cache hints" \
            -m "Add configurable TTL-aware caching for cacheable client responses, authorization-context partitioning for private entries, complete request cache keys, pagination and notification invalidation, documentation, and regression coverage."
          npx commitlint --config /tmp/commitlint.config.js --from upstream/main --to HEAD --verbose
          git push --force-with-lease origin HEAD:feat/issue-974-client-response-cache
