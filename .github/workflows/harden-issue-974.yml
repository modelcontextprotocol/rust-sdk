name: Diagnose issue 974 validation

on:
  push:
    branches:
      - feat/issue-974-client-response-cache
    paths:
      - .github/workflows/harden-issue-974.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v7
        with:
          ref: feat/issue-974-client-response-cache
          fetch-depth: 0

      - name: Install stable Rust with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Run and record repository checks
        shell: bash
        run: |
          set +e
          : > issue-974-validation-result.txt
          failed=0

          run_check() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            echo "===== ${name} =====" >> issue-974-validation-result.txt
            "$@" >"$log" 2>&1
            status=$?
            echo "status=${status}" >> issue-974-validation-result.txt
            if [ "$status" -ne 0 ]; then
              failed=1
              echo "--- last 200 log lines ---" >> issue-974-validation-result.txt
              tail -n 200 "$log" >> issue-974-validation-result.txt
            fi
            echo >> issue-974-validation-result.txt
          }

          run_check nightly_fmt cargo +nightly fmt --all -- --check
          run_check whitespace git diff --check
          run_check workspace_check cargo check --workspace --all-targets --all-features
          run_check workspace_clippy cargo clippy --all-targets --all-features -- -D warnings
          run_check all_feature_tests cargo test --all-features

          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "rmcp") | .features | keys[] \
                      | select(startswith("__") | not) \
                      | select(. != "local")] | join(",")')
          run_check rmcp_no_local_tests cargo test -p rmcp --features "$FEATURES"
          run_check docs env RUSTDOCFLAGS=-Dwarnings cargo doc -p rmcp --all-features --no-deps
          run_check conformance_build cargo build -p mcp-conformance

          echo "overall_failed=${failed}" >> issue-974-validation-result.txt

      - name: Commit diagnostic report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-974-validation-result.txt
          git commit -m "test: record issue 974 validation diagnostics" || true
          git push origin HEAD:feat/issue-974-client-response-cache
