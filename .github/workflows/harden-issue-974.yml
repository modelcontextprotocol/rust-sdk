name: Finalize issue 974 validation

on:
  push:
    branches:
      - feat/issue-974-client-response-cache
    paths:
      - .github/workflows/harden-issue-974.yml

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-974-client-response-cache
          fetch-depth: 0

      - name: Install toolchains
        run: |
          rustup toolchain install stable --component clippy
          rustup toolchain install nightly --component rustfmt

      - name: Apply final hardening edits
        run: |
          python scripts/finalize_issue_974.py
          cargo +nightly fmt --all
          git diff --check

      - name: Commit hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/rmcp/src/service/client.rs \
            crates/rmcp/src/service/client/cache.rs \
            docs/CLIENT_CACHING.md
          git commit -m "fix(client): prevent stale cache writes" || true
          git push origin HEAD:feat/issue-974-client-response-cache

      - name: Run repository checks and capture logs
        shell: bash
        continue-on-error: true
        run: |
          set +e
          : > issue-974-validation-result.txt
          failed=0

          run_check() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            echo "===== ${name} =====" >> issue-974-validation-result.txt
            "$@" >"$log" 2>&1
            status=$?
            echo "status=${status}" >> issue-974-validation-result.txt
            if [ "$status" -ne 0 ]; then
              failed=1
              echo "--- last 300 log lines ---" >> issue-974-validation-result.txt
              tail -n 300 "$log" >> issue-974-validation-result.txt
            fi
            echo >> issue-974-validation-result.txt
          }

          run_check nightly_fmt cargo +nightly fmt --all -- --check
          run_check whitespace git diff --check
          run_check rmcp_check cargo check -p rmcp --all-targets --all-features
          run_check workspace_clippy cargo clippy --all-targets --all-features -- -D warnings
          run_check all_feature_tests cargo test --all-features

          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "rmcp") | .features | keys[] \
                      | select(startswith("__") | not) \
                      | select(. != "local")] | join(",")')
          echo "FEATURES=${FEATURES}" >> issue-974-validation-result.txt
          run_check rmcp_no_local_tests cargo test -p rmcp --features "$FEATURES"

          run_check docs env RUSTDOCFLAGS=-Dwarnings cargo doc -p rmcp --all-features --no-deps
          run_check conformance_build cargo build -p mcp-conformance

          echo "overall_failed=${failed}" >> issue-974-validation-result.txt

      - name: Commit validation report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f issue-974-validation-result.txt ]; then
            printf 'validation step did not create a report\n' > issue-974-validation-result.txt
          fi
          git add issue-974-validation-result.txt
          git commit -m "test: record issue 974 validation diagnostics" || true
          git push origin HEAD:feat/issue-974-client-response-cache
