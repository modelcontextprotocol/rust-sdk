name: Harden and validate issue 974

on:
  push:
    branches:
      - feat/issue-974-client-response-cache
    paths:
      - .github/workflows/harden-issue-974.yml

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v7
        with:
          ref: feat/issue-974-client-response-cache
          fetch-depth: 0

      - name: Install stable Rust with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Apply hardening changes
        env:
          SCRIPT_GZ_B64: >-
            
        run: |
          printf '%s' "$SCRIPT_GZ_B64" | base64 --decode | gzip --decompress > /tmp/apply_issue_974_hardening.py
          python /tmp/apply_issue_974_hardening.py

      - name: Format with repository toolchain
        run: cargo +nightly fmt --all

      - name: Verify formatting and whitespace
        run: |
          cargo +nightly fmt --all -- --check
          git diff --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Run workspace Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run all-feature tests
        run: cargo test --all-features

      - name: Run rmcp tests without local feature
        run: |
          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "rmcp") | .features | keys[] \
                      | select(startswith("__") | not) \
                      | select(. != "local")] | join(",")')
          cargo test -p rmcp --features "$FEATURES"

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p rmcp --all-features --no-deps

      - name: Build conformance binaries
        run: cargo build -p mcp-conformance

      - name: Run spelling check
        uses: crate-ci/typos@master

      - name: Record success
        if: success()
        run: |
          cat > issue-974-validation-result.txt <<'EOF'
          nightly_fmt=success
          whitespace=success
          workspace_check=success
          workspace_clippy=success
          all_feature_tests=success
          rmcp_no_local_tests=success
          docs=success
          conformance_build=success
          typos=success
          EOF

      - name: Record failure
        if: failure()
        run: |
          cat > issue-974-validation-result.txt <<'EOF'
          validation=failed
          Inspect the GitHub Actions job logs for the first failing step.
          EOF

      - name: Commit implementation and validation result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/rmcp/src/service.rs \
            crates/rmcp/src/service/client.rs \
            crates/rmcp/src/service/client/cache.rs \
            crates/rmcp/src/handler/client.rs \
            crates/rmcp/CHANGELOG.md \
            docs/CLIENT_CACHING.md \
            issue-974-validation-result.txt
          git commit -m "feat(client): complete SEP-2549 response caching" || true
          git push origin HEAD:feat/issue-974-client-response-cache
