name: Verify and apply Rust SDK issue 974 refinements

on:
  push:
    branches:
      - feat/issue-974-client-response-cache
    paths:
      - .github/workflows/apply-issue-974-final.yml

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-974-client-response-cache
          fetch-depth: 0

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Apply repository-local deterministic patch
        run: python3 ci/issue_974_final_patch.py

      - name: Format and verify whitespace
        run: |
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check

      - name: Run issue-specific and repository checks
        run: |
          cargo test -p rmcp --all-features service::client::tests -- --nocapture
          cargo test -p rmcp --all-features --test test_tool_disable_notification -- --nocapture
          cargo test -p rmcp --all-features --test test_cache_hints -- --nocapture
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "rmcp") | .features | keys[] \
                      | select(startswith("__") | not) \
                      | select(. != "local")] | join(",")')
          cargo test -p rmcp --features "$FEATURES"

      - name: Commit verified Rust SDK changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/rmcp/src/service/client.rs \
            crates/rmcp/src/service/client/cache.rs \
            crates/rmcp/tests/test_tool_disable_notification.rs \
            docs/CLIENT_CACHING.md
          if git diff --cached --quiet; then
            echo "No code changes to commit"
          else
            git commit -m "fix(client): complete response cache semantics"
            git push origin HEAD:feat/issue-974-client-response-cache
          fi
