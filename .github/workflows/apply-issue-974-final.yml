name: Apply final issue 974 refinements

on:
  push:
    branches:
      - feat/issue-974-client-response-cache
    paths:
      - .github/workflows/apply-issue-974-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-974-client-response-cache
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: rustup toolchain install nightly --component rustfmt

      - name: Apply deterministic patch
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/starsaintf/codex-skills-pack/ci/rust-sdk-issue-974-validation/ci/issue_974_final_patch.py \
            --output /tmp/issue_974_final_patch.py
          python3 /tmp/issue_974_final_patch.py

      - name: Format and verify
        run: |
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check

      - name: Run focused and repository checks
        run: |
          cargo test -p rmcp --all-features service::client::tests -- --nocapture
          cargo test -p rmcp --all-features --test test_tool_disable_notification -- --nocapture
          cargo test -p rmcp --all-features --test test_cache_hints -- --nocapture
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "rmcp") | .features | keys[] \
                      | select(startswith("__") | not) \
                      | select(. != "local")] | join(",")')
          cargo test -p rmcp --features "$FEATURES"

      - name: Commit verified refinements
        run: |
          rm .github/workflows/apply-issue-974-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(client): complete response cache semantics"
          git push origin HEAD:feat/issue-974-client-response-cache
