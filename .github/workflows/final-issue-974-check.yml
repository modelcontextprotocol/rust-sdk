name: Final issue 974 compliance check

on:
  push:
    branches:
      - feat/issue-974-client-response-cache
    paths:
      - .github/workflows/final-issue-974-check.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-974-client-response-cache
          fetch-depth: 0

      - name: Install toolchains
        run: |
          rustup toolchain install stable --component clippy
          rustup toolchain install nightly --component rustfmt

      - name: Run checks and record results
        shell: bash
        run: |
          set +e
          : > final-issue-974-check.txt
          failed=0

          run_check() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            "$@" >"$log" 2>&1
            status=$?
            printf '%s=%s\n' "$name" "$status" >> final-issue-974-check.txt
            if [ "$status" -ne 0 ]; then
              failed=1
              printf '\n--- %s log ---\n' "$name" >> final-issue-974-check.txt
              tail -n 250 "$log" >> final-issue-974-check.txt
              printf '\n--- end %s log ---\n' "$name" >> final-issue-974-check.txt
            fi
          }

          FEATURES=$(python - <<'PY'
          import tomllib
          with open('crates/rmcp/Cargo.toml', 'rb') as file:
              features = tomllib.load(file)['features']
          print(','.join(sorted(
              name for name in features
              if name != 'local' and not name.startswith('__')
          )))
          PY
          )
          printf 'features=%s\n' "$FEATURES" >> final-issue-974-check.txt
          test -n "$FEATURES" || failed=1

          run_check nightly_fmt cargo +nightly fmt --all -- --check
          run_check whitespace git diff --check
          run_check rmcp_check cargo check -p rmcp --all-targets --all-features
          run_check clippy cargo clippy --all-targets --all-features -- -D warnings
          run_check all_feature_tests cargo test --all-features
          run_check focused_cache_tests cargo test -p rmcp --all-features service::client::tests -- --nocapture
          run_check no_local_tests cargo test -p rmcp --features "$FEATURES"
          run_check docs env RUSTDOCFLAGS=-Dwarnings cargo doc -p rmcp --all-features --no-deps
          run_check conformance_build cargo build -p mcp-conformance

          printf 'overall=%s\n' "$failed" >> final-issue-974-check.txt

      - name: Run spelling check
        id: typos
        continue-on-error: true
        uses: crate-ci/typos@master

      - name: Record spelling result
        if: always()
        shell: bash
        run: |
          touch final-issue-974-check.txt
          if [ "${{ steps.typos.outcome }}" = success ]; then
            printf 'typos=0\n' >> final-issue-974-check.txt
          else
            printf 'typos=1\n' >> final-issue-974-check.txt
            if grep -q '^overall=0$' final-issue-974-check.txt; then
              sed -i 's/^overall=0$/overall=1/' final-issue-974-check.txt
            else
              printf 'overall=1\n' >> final-issue-974-check.txt
            fi
          fi

      - name: Commit result
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          touch final-issue-974-check.txt
          git add final-issue-974-check.txt
          git commit -m "test: record final issue 974 compliance check" || true
          git push origin HEAD:feat/issue-974-client-response-cache
